name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest --cov=contactreceipt --cov-report=term-missing
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel in an isolated environment
        run: |
          python -m venv /tmp/contactreceipt-wheel-check
          /tmp/contactreceipt-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/contactreceipt-wheel-check/bin/contactreceipt --version
          /tmp/contactreceipt-wheel-check/bin/contactreceipt validate \
            --trace examples/trace-pass.json \
            --policy examples/policy.json \
            --evidence examples/evidence.json \
            --output /tmp/contactreceipt-wheel-receipt.json
